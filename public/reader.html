<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Book - SimSim Fun Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/icon2.png">
</head>
<body>
    <header>
        <a href="index.html" class="logo"><img src="images/icon2.png" alt="" aria-hidden="true"><span>SimSim Fun<br>Store</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">My Library 📚</a>
            <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main class="container" style="max-width: 1000px;">
        <div id="reader-container" style="background: white; padding: 1.5rem; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.06);">
            <p style="color: #666; text-align: center;">Opening your book...</p>
        </div>
    </main>

    <footer>
        <a href="contact.html" class="footer-contact" aria-label="Contact SimSim Fun Store" title="Contact Us">✉ Contact</a>
        <button type="button" class="footer-share-btn" onclick="shareWebsite()" aria-label="Share SimSim Fun Store">📤 Share</button>
        <p>&copy; 2026 SimSim Fun Store. Safe & Fun for Kids.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-data.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("reader-container");
            const productId = new URLSearchParams(window.location.search).get("id");
            let user = localStorage.getItem("simsim_user");
            let library = user ? JSON.parse(localStorage.getItem(`simsim_library_${user}`)) || [] : [];

            if (hasSupabaseConnection()) {
                try {
                    const supabaseUser = await getSupabaseUser();
                    user = supabaseUser ? supabaseUser.email : null;
                    library = user ? await loadLibraryFromSupabase() || [] : [];
                } catch (error) {
                    console.error("Could not load the online library.", error);
                    user = null;
                    library = [];
                }
            }

            const book = library.find(item => item.id === productId && item.type === "book");
            if (!user) {
                container.innerHTML = '<h2>🔒 Sign In Required</h2><p>Please sign in to read your purchased books.</p><a href="login.html" class="btn">Sign In 🔐</a>';
                return;
            }
            if (!book || !book.downloadUrl || book.downloadUrl === "#") {
                container.innerHTML = '<h2>Book Not Available</h2><p>This book is available after purchase.</p><a href="catalog.html" class="btn">Browse Catalog 🛒</a>';
                return;
            }

            container.innerHTML = `
                <h1 style="margin-bottom: 1rem;">${book.title}</h1>
                <iframe src="${book.downloadUrl}#toolbar=0&navpanes=0&scrollbar=1" title="${book.title}" style="display: block; width: 100%; height: 78vh; min-height: 600px; border: 1px solid #cbd5e0; border-radius: 10px;"></iframe>
                <a href="dashboard.html" class="btn" style="display: inline-block; margin-top: 1rem; background: #4ECDC4;">Back to My Library 📚</a>
            `;
        });
    </script>
</body>
</html>
