<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - SimSim Fun Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/icon2.png">
</head>
<body>

    <header>
        <a href="index.html" class="logo"><img src="images/icon2.png" alt="" aria-hidden="true"><span>SimSim Fun<br>Store</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">My Library 📚</a>
        </nav>
    </header>

    <main class="container" style="max-width: 700px; text-align: center;">
        <div style="background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.06);">
            <div style="font-size: 4rem; margin-bottom: 1rem;">🎉</div>
            <h1 style="color: #2b6cb0; margin-bottom: 1rem;">Payment Successful!</h1>
            <p style="font-size: 1.1rem; color: #555; margin-bottom: 2rem;">Thank you for your purchase. Your digital items have been successfully unlocked and added to your permanent library!</p>
            
            <div id="purchased-items-list" style="text-align: left; margin-bottom: 2rem; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 1.5rem 0;">
                <!-- Dynamically rendered purchased files -->
            </div>

            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <a href="dashboard.html" class="btn" style="background: #4ECDC4;">Go to My Library Dashboard 📖</a>
                <a href="index.html" class="btn">Back to Home 🌟</a>
            </div>
        </div>
    </main>

    <footer>
        <a href="contact.html" class="footer-contact" aria-label="Contact SimSim Fun Store" title="Contact Us">✉ Contact</a>
        <button type="button" class="footer-share-btn" onclick="shareWebsite()" aria-label="Share SimSim Fun Store">📤 Share</button>
        <p>&copy; 2026 SimSim Fun Store. Safe & Fun for Kids.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-data.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const listContainer = document.getElementById("purchased-items-list");
            const pendingCheckout = JSON.parse(localStorage.getItem("simsim_pending_checkout")) || null;
            if (!pendingCheckout?.orderId) {
                alert("No active PayPal order was found. Your items are still in the cart.");
                window.location.href = "cart.html";
                return;
            }
            const { data, error } = await window.supabaseClient.auth.getSession();
            const accessToken = data?.session?.access_token;
            if (error || !accessToken) {
                alert("Please sign in again to verify this payment.");
                window.location.href = "login.html";
                return;
            }

            const captureResponse = await fetch("/api/paypal/capture-order", {
                method: "POST",
                headers: {
                    "content-type": "application/json",
                    authorization: `Bearer ${accessToken}`
                },
                body: JSON.stringify({ orderId: pendingCheckout.orderId })
            });
            const captureText = await captureResponse.text();
            let captureResult = {};
            try {
                captureResult = captureText ? JSON.parse(captureText) : {};
            } catch (parseError) {
                alert(`Payment service returned an invalid response (${captureResponse.status}).`);
                window.location.href = "cart.html";
                return;
            }
            if (!captureResponse.ok || !captureResult.paid) {
                alert(captureResult.error || "Payment could not be verified. Your items remain in the cart.");
                window.location.href = "cart.html";
                return;
            }

            const cart = pendingCheckout.items;

            if (cart.length === 0) {
                listContainer.innerHTML = "<p style='text-align: center; color: #666;'>No active cart items found. Check your Library Dashboard to view your purchased content.</p>";
                return;
            }

            // Render purchased items with proper preview images and buttons[cite: 3]
            listContainer.innerHTML = `<h3>Your Unlocked Items:</h3>` + cart.map(item => {
                const catalogProduct = typeof SIMSIM_PRODUCTS !== "undefined"
                    ? SIMSIM_PRODUCTS.find(product => product.id === item.id)
                    : null;
                const displayItem = catalogProduct
                    ? { ...catalogProduct, ...item, images: item.images?.length ? item.images : catalogProduct.images }
                    : item;
                const coverImage = catalogProduct?.images?.[0]
                    || displayItem.coverImage
                    || displayItem.images?.[0]
                    || "images/icon2.png";
                let actionBtn = '';

                if (displayItem.type === 'puzzle-game') {
                    actionBtn = `<a href="${displayItem.downloadUrl}" class="btn" style="background: #FF6B6B; padding: 6px 14px; font-size: 0.9rem;">Play Game 🧩</a>`;
                } else if (displayItem.type === 'video') {
                    actionBtn = `<a href="video-player.html?id=${encodeURIComponent(displayItem.id)}" class="btn" style="padding: 6px 14px; font-size: 0.9rem;">Watch Video ▶</a>`;
                } else if (displayItem.type === 'coloring-activity') {
                    actionBtn = `<a href="coloring.html?book=${displayItem.id}" class="btn" style="background: #4ECDC4; padding: 6px 14px; font-size: 0.9rem;">Open Studio 🎨</a>`;
                } else {
                    actionBtn = `<a href="reader.html?id=${encodeURIComponent(displayItem.id)}" class="btn" style="padding: 6px 14px; font-size: 0.9rem;">Read Book 📖</a>`;
                }

                return `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 10px; background: #f7fafc; border-radius: 8px; flex-wrap: wrap; gap: 10px;">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <img src="${coverImage}" alt="${item.title}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 6px;">
                            <div>
                                <strong>${displayItem.title}</strong>
                                <div style="font-size: 0.85rem; color: #666;">${displayItem.category}</div>
                            </div>
                        </div>
                        <div>${actionBtn}</div>
                    </div>
                `;
            }).join('');

            // Save confirmed purchase to local user library ONLY after payment is verified
            const currentUser = pendingCheckout.user || localStorage.getItem("simsim_user");
            if (currentUser) {
                const libraryKey = `simsim_library_${currentUser}`;
                let userLibrary = JSON.parse(localStorage.getItem(libraryKey)) || [];
                cart.forEach(item => {
                    if (!userLibrary.some(existing => existing.id === item.id)) {
                        userLibrary.push(item);
                    }
                });
                localStorage.setItem(libraryKey, JSON.stringify(userLibrary));
            }

            // Clear both active and pending checkout state after fulfillment.
            localStorage.removeItem("simsim_cart");
            localStorage.removeItem("simsim_pending_checkout");

            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1500);
        });
    </script>
</body>
</html>
