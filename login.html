<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Login - SimSim eBook Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">🌟 SimSim Store</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="catalog.html">All Books & Videos</a>
            <a href="login.html" class="active">Parent Login</a>
            <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main class="container" style="max-width: 450px; margin-top: 3rem;">
        <div style="background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.06);">
            <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary-color);">🔐 Parent Portal Login</h2>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div style="margin-bottom: 1.2rem;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #444;">Email Address</label>
                    <input type="email" id="login-email" required autocomplete="username" placeholder="parent@example.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem;">
                </div>

                <div style="margin-bottom: 1.2rem;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #444;">Password</label>
                    <input type="password" id="login-password" required minlength="6" autocomplete="current-password" placeholder="••••••••" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem;">
                </div>

                <!-- Keep Me Logged In Checkbox -->
                <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="remember-me" checked style="width: 18px; height: 18px; cursor: pointer;">
                    <label for="remember-me" style="font-size: 0.95rem; color: #555; cursor: pointer;">Keep me logged in</label>
                </div>

                <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 1.05rem;">Sign In 🚀</button>
                <button type="button" class="btn" onclick="registerAccount()" style="width: 100%; padding: 10px; margin-top: 10px; background: #4ECDC4;">Create New Account</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SimSim eBook Store. Safe & Fun for Kids.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof updateCartCount === 'function') {
                updateCartCount();
            }
        });

        async function hashPassword(password) {
            const data = new TextEncoder().encode(password);
            const hash = await crypto.subtle.digest("SHA-256", data);
            return Array.from(new Uint8Array(hash)).map(byte => byte.toString(16).padStart(2, "0")).join("");
        }

        async function handleLogin(event) {
            event.preventDefault();
            const emailInput = document.getElementById("login-email").value.trim();
            const passwordInput = document.getElementById("login-password").value;
            const rememberMe = document.getElementById("remember-me").checked;

            if (!emailInput || passwordInput.length < 6) {
                alert("Please enter a valid email address and a password with at least 6 characters.");
                return;
            }

            if (hasSupabaseConnection()) {
                const { error: signInError } = await window.supabaseClient.auth.signInWithPassword({
                    email: emailInput,
                    password: passwordInput
                });
                if (signInError) {
                    alert(formatAuthError(signInError));
                    return;
                }
                localStorage.setItem("simsim_user", emailInput);
                localStorage.setItem("simsim_remember", rememberMe ? "true" : "false");
                alert(`Welcome back, ${emailInput}! 🎉`);
                window.location.assign("index.html");
                return;
            }

            try {
                const accountKey = emailInput.toLowerCase();
                const accounts = JSON.parse(localStorage.getItem("simsim_accounts")) || {};
                const passwordHash = await hashPassword(passwordInput);

                if (accounts[accountKey] && accounts[accountKey].passwordHash !== passwordHash) {
                    alert("That password is incorrect. Please try again.");
                    return;
                }

                if (!accounts[accountKey]) {
                    accounts[accountKey] = { passwordHash };
                    localStorage.setItem("simsim_accounts", JSON.stringify(accounts));
                }

                localStorage.setItem("simsim_user", emailInput);
                localStorage.setItem("simsim_remember", rememberMe ? "true" : "false");
            } catch (error) {
                console.warn("Could not save the local account.", error);
                alert("Unable to save your account on this browser. Please enable site storage and try again.");
                return;
            }

            alert(`Welcome back, ${emailInput}! 🎉`);

            window.location.assign("index.html");
        }

        async function registerAccount() {
            const emailInput = document.getElementById("login-email").value.trim();
            const passwordInput = document.getElementById("login-password").value;
            if (!emailInput || passwordInput.length < 6) {
                alert("Enter a valid email and a password with at least 6 characters.");
                return;
            }
            if (!hasSupabaseConnection()) {
                alert("Online account registration is not configured.");
                return;
            }
            const { error } = await window.supabaseClient.auth.signUp({
                email: emailInput,
                password: passwordInput,
                options: { emailRedirectTo: `${window.location.origin}/login.html` }
            });
            if (error) {
                alert(formatAuthError(error));
                return;
            }
            alert("Account created. Check your email once to confirm your account, then sign in.");
        }

        function formatAuthError(error) {
            if (error.status === 429 || /rate limit|too many requests/i.test(error.message)) {
                return "Too many email requests. Please wait a few minutes before trying again. Sign in does not send another email.";
            }
            return error.message || "Sign in failed. Check your email and password.";
        }
    </script>
</body>
</html>
